<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>TP3 - WebVR (Version VR Pure)</title>
        <!-- Inclusion d'A-Frame -->
        <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
        <!-- Composants pour la physique et les interactions VR / mouvements en rig -->
        <script
            src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <script
            src="https://unpkg.com/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

        <script>
            // Logique de tir VR (Exercice 3 & 4) via la gâchette du contrôleur
            AFRAME.registerComponent('weapon-shooter', {
                init: function () {
                    this.el.addEventListener('triggerdown', (evt) => {
                        let sceneEl = document.querySelector('a-scene');
                        let bullet = document.createElement('a-sphere');

                        // Position de départ du projectile (au niveau du contrôleur)
                        let worldPos = new THREE.Vector3();
                        this.el.object3D.getWorldPosition(worldPos);

                        bullet.setAttribute('position', worldPos);
                        bullet.setAttribute('radius', '0.08');
                        bullet.setAttribute('color', '#FF0000');
                        bullet.setAttribute('dynamic-body', '');

                        sceneEl.appendChild(bullet);

                        // Appliquer une force / vélocité vers l'avant du contrôleur
                        let direction = new THREE.Vector3(0, 0, -1);
                        direction.applyQuaternion(this.el.object3D.quaternion);
                        direction.multiplyScalar(25); // Vitesse du tir

                        setTimeout(() => {
                            if (bullet.body) {
                                bullet.body.velocity.set(direction.x, direction.y, direction.z);
                            }
                        }, 10);

                        // Détection des impacts sur les cibles (Exercice 4)
                        bullet.addEventListener('collide', function (e) {
                            let hitEl = e.detail.body.el;
                            if (hitEl && hitEl.classList.contains('target')) {
                                hitEl.setAttribute('color', '#00FF00'); // Feedback visuel (vert à l'impact)
                                setTimeout(() => {
                                    hitEl.parentNode.removeChild(hitEl);
                                }, 200);
                            }
                        });
                    });
                }
            });
        </script>
    </head>

    <body>

        <a-scene physics="gravity: -9.8">

            <!-- ================= EXERCICE 1 : ÉCLAIRAGE ET DÉCOR ================= -->
            <a-ambient-light color="#ffffff" intensity="0.4"></a-ambient-light>
            <a-directional-light position="2 6 -2" intensity="0.8"
                cast-shadow="true"></a-directional-light>

            <!-- Sol -->
            <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"
                static-body></a-plane>

            <!-- Objets de base de la scène -->
            <a-box position="-2 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow="cast: true"
                static-body></a-box>
            <a-sphere position="2 1 -4" radius="1" color="#EF2D5E" shadow="cast: true"
                static-body></a-sphere>


            <!-- ================= EXERCICE 2 : OBJETS SAISISSABLES (GRAB) ================= -->
            <a-box position="0 1 -2" width="0.5" height="0.5" depth="0.5" color="#FFC65D"
                dynamic-body grabbable shadow="cast: true"></a-box>
            <a-box position="0.8 1 -2.5" width="0.4" height="0.4" depth="0.4" color="#F16745"
                dynamic-body grabbable shadow="cast: true"></a-box>


            <!-- ================= EXERCICE 4 : CIBLES ALÉATOIRES ================= -->
            <a-entity id="targets-container">
                <a-box class="target" position="-3 1.5 -5" width="0.8" height="0.8" depth="0.8"
                    color="#9b59b6" static-body></a-box>
                <a-cone class="target" position="3 1.5 -5" radius-bottom="0.5" height="1"
                    color="#f1c40f" static-body></a-cone>
                <a-box class="target" position="0 2.5 -6" width="0.8" height="0.8" depth="0.8"
                    color="#e67e22" static-body></a-box>
            </a-entity>


            <!-- ================= ENTITÉ RIG, CAMÉRA & CONTRÔLEURS VR ================= -->
            <a-entity id="player" position="0 0 2">
                <a-camera></a-camera>
                <!-- Contrôleur gauche pour les déplacements avec le joystick (Exercice 1) -->
                <a-entity laser-controls="hand: left" oculus-touch-controls="hand: left"
                    movement-controls></a-entity>
                <!-- Contrôleur droit configuré pour tirer avec la gâchette (Exercice 3) et attraper (Exercice 2) -->
                <a-entity laser-controls="hand: right" oculus-touch-controls="hand: right"
                    weapon-shooter></a-entity>
            </a-entity>

        </a-scene>

    </body>

</html>
