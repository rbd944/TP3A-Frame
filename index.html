<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <title>TP3 - WebVR (VR Joystick & Bouton A)</title>
        <!-- Inclusion d'A-Frame et des scripts de physique/extras -->
        <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
        <script
            src="https://unpkg.com/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>

        <script>
            // Composant de tir lié au bouton A de la manette droite
            AFRAME.registerComponent('vr-shooter', {
                init: function () {
                    this.el.addEventListener('abuttondown', (evt) => {
                        let sceneEl = document.querySelector('a-scene');
                        let bullet = document.createElement('a-sphere');

                        let worldPos = new THREE.Vector3();
                        this.el.object3D.getWorldPosition(worldPos);

                        bullet.setAttribute('position', worldPos);
                        bullet.setAttribute('radius', '0.08');
                        bullet.setAttribute('color', '#FF0000');
                        bullet.setAttribute('dynamic-body', '');

                        sceneEl.appendChild(bullet);

                        let direction = new THREE.Vector3(0, 0, -1);
                        direction.applyQuaternion(this.el.object3D.quaternion);
                        direction.multiplyScalar(20);

                        setTimeout(() => {
                            if (bullet.body) {
                                bullet.body.velocity.set(direction.x, direction.y, direction.z);
                            }
                        }, 10);

                        bullet.addEventListener('collide', function (e) {
                            let hitEl = e.detail.body.el;
                            if (hitEl && hitEl.classList.contains('target')) {
                                hitEl.setAttribute('color', '#00FF00');
                                setTimeout(() => {
                                    hitEl.parentNode.removeChild(hitEl);
                                }, 200);
                            }
                        });
                    });
                }
            });
        </script>
    </head>

    <body>

        <a-scene physics="gravity: -9.8; debug: false">

            <!-- Éclairage et Décor (Exercice 1)[cite: 1] -->
            <a-ambient-light color="#ffffff" intensity="0.5"></a-ambient-light>
            <a-directional-light position="2 6 -2" intensity="0.8"
                cast-shadow="true"></a-directional-light>

            <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"
                static-body></a-plane>

            <a-box position="-2 0.5 -3" rotation="0 45 0" color="#4CC3D9" static-body></a-box>
            <a-sphere position="2 1 -4" radius="1" color="#EF2D5E" static-body></a-sphere>

            <!-- Objets à attraper (Exercice 2)[cite: 1] -->
            <a-box position="0 1 -2" width="0.4" height="0.4" depth="0.4" color="#FFC65D"
                dynamic-body grabbable></a-box>
            <a-box position="0.6 1 -2.2" width="0.4" height="0.4" depth="0.4" color="#F16745"
                dynamic-body grabbable></a-box>

            <!-- Cibles (Exercice 4)[cite: 1] -->
            <a-entity id="targets-container">
                <a-box class="target" position="-3 1.5 -5" width="0.8" height="0.8" depth="0.8"
                    color="#9b59b6" static-body></a-box>
                <a-cone class="target" position="3 1.5 -5" radius-bottom="0.5" height="1"
                    color="#f1c40f" static-body></a-cone>
            </a-entity>

            <!-- Rig Joueur et Contrôleurs VR (Exercice 1 & 3)[cite: 1] -->
            <a-entity id="player" movement-controls="fly: false; controls: oculus-touch"
                position="0 0 2">
                <a-camera position="0 1.6 0"></a-camera>
                <!-- Contrôleur gauche : piloté par le joystick pour bouger -->
                <a-entity id="left-hand" oculus-touch-controls="hand: left"></a-entity>
                <!-- Contrôleur droit : bouton A pour tirer -->
                <a-entity id="right-hand" oculus-touch-controls="hand: right" vr-shooter></a-entity>
            </a-entity>

        </a-scene>

    </body>

</html>
